<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Bitcircle</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

    <main class="app-container">

        <section id="home" class="page-section active">
            <div class="topBar">
                <a href="#create">
                    <i class="fa-solid fa-plus"></i>
                </a>
                <h1 class="logo">Bitcircle</h1>
                <a href="#notifications">
                    <i class="fa-solid fa-heart"></i>
                </a>
            </div>
            <div class="story-area">
                <div class="profile-pic">
                    <div class="profile-avatar">
                        <span class="avatar-head"></span>
                        <span class="avatar-body"></span>
                    </div>
                </div>
            </div>
        </section>
        
        <section id="searchingbar" class="page-section">
            <div class="explore-page">
                <div class="search-head">
                  <label for="search-bar"></label>
                  <input type="search" id="search-bar" placeholder="search">
                </div>
            </div>
        </section>

        <section id="profile" class="page-section">
            <div class="profile-head">
               <button class="create-btn">
                   <i class="fa-solid fa-plus"></i>
               </button>
               <h1 class="username"></h1>
               <button class="menu-btn">
                   <i class="fa-solid fa-bars"></i>
               </button>
            </div>
            <div class="profileHead-items">
              <div id="menu" class="head-item">
                  <div class="menu-items">
                    <ul class="menu-list">
                        <li class="settings">Settings</li>
                        <li class="contact-details">Contact-info</li>
                        <li class="security">Password & Security</li>
                    </ul>
                    <button class="logout">Log out</button>
                  </div>
              </div>
            </div>
            <div class="profileBar">
                <div class="profile-pic">
                     <div class="profile-avatar">
                         <span class="avatar-head"></span>
                         <span class="avatar-body"></span>
                     </div>
                 </div>
                 <div class="profile-stat">
                     <div class="stat">
                         <span class="post-count">0</span>
                         <p>posts</p>
                     </div>
                     <div class="stat">
                         <span class="followers">0</span>
                         <p>followers</p>
                     </div>
                     <div class="stat">
                         <span class="following">0</span>
                         <p>following</p>
                     </div>
                 </div>
             </div>
             <div class="about-section">
                 <h4 class="profile-name"></h4>
                 <p class="profile-bio"></p>
             </div>
             <div class="edit-profile">
                <button class="editProfile-btn">Edit-Profile
                </button>
             </div>
             <nav class="profile-nav">
                 <button data-item="post-grid">
                     <i class="fa-solid fa-table-cells"></i>
                 </button>
                 <button data-item="reel-post">
                     <i class="fa-solid fa-square-caret-right">
                     </i>
                 </button>
                 <button data-item="music">
                     <i class="fa-solid fa-headphones"></i>
                 </button>
                 <button data-item="saved">
                     <i class="fa-solid fa-bookmark"></i>
                 </button>
             </nav>
             <div class="profile-items">
                 <section id="post-grid" class="item active">
                     <h2>Post grid</h2>
                 </section>
                 <section id="reel-post" class="item">
                     <h2>Reels</h2>
                 </section>
                 <section id="music" class="item">
                     <h2>music</h2>
                 </section>
                 <section id="saved" class="item">
                     <h2>saved</h2>
                 </section>
             </div>
        </section>

        <section id="chatbox" class="page-section">
            <h1>Chatbox</h1>
        </section>

        <section id="reel-section" class="page-section">
            <h1>Reel Section</h1>
        </section>

    </main>
    
    <nav class="bottom-nav">

        <button data-page="home">
            <i class="fa-solid fa-house"></i>
        </button>
        
        <button data-page="searchingbar">
            <i class="fa-solid fa-search"></i>
        </button>
        
        <button data-page="reel-section">
            <i class="fa-solid fa-circle-play"></i>
        </button>

        <button data-page="chatbox">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
        
        <button data-page="profile" class="profile-btn">
                <div class="navProfile-avatar">
                    <span class="navAvatar-head"></span>
                    <span class="navAvatar-body"></span>
                </div>
        </button>

    </nav>

    <script src="editProfile.js"></script>
    <script src="profile.js"></script>
    <script src="app.js"></script>

</body>
</html>
